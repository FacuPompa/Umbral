spring.application.name=umbral

# Desarrollo local: admite .env en la raíz o dentro de backend/. En producción,
# las mismas claves deben llegar como variables de entorno, no como archivos.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/umbral
spring.datasource.username=umbral
spring.datasource.password=umbral_local

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Initial data
spring.sql.init.mode=always

# Identity
# La primera cuenta registrada con este email obtiene MODERATOR. Configurarlo
# solo en el entorno local antes del primer registro; no guardar el email aquí.
umbral.auth.bootstrap-moderator-email=${UMBRAL_BOOTSTRAP_MODERATOR_EMAIL:}

# Integraciones externas
# La clave queda fuera de Git, en RAWG_API_KEY. RAWG se usa solo del lado de
# Spring para buscar ediciones que luego pasan por moderación antes de entrar
# al catálogo local.
umbral.integrations.rawg.api-key=${RAWG_API_KEY:}
