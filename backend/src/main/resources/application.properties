spring.application.name=umbral

# Desarrollo local: admite .env en la raíz o dentro de backend/. En producción,
# las mismas claves deben llegar como variables de entorno, no como archivos.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/umbral}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:umbral}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:umbral_local}

# Servidor y sesión
server.port=${PORT:8080}
umbral.session-cookie.same-site=${UMBRAL_SESSION_COOKIE_SAME_SITE:Lax}
umbral.session-cookie.secure=${UMBRAL_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${umbral.session-cookie.same-site}
server.servlet.session.cookie.secure=${umbral.session-cookie.secure}

# El frontend local y el desplegado pueden cambiar esta URL sin tocar el código.
umbral.cors.allowed-origin=${UMBRAL_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Initial data
spring.sql.init.mode=always

# Integraciones externas
# La clave queda fuera de Git, en RAWG_API_KEY. RAWG se usa solo del lado de
# Spring para buscar ediciones que luego pasan por moderación antes de entrar
# al catálogo local.
umbral.integrations.rawg.api-key=${RAWG_API_KEY:}
