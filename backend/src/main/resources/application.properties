spring.application.name=umbral

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/umbral
spring.datasource.username=umbral
spring.datasource.password=umbral_local

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Initial data
spring.sql.init.mode=always

# Identity
# La primera cuenta registrada con este email obtiene MODERATOR. Configurarlo
# solo en el entorno local antes del primer registro; no guardar el email aquí.
umbral.auth.bootstrap-moderator-email=${UMBRAL_BOOTSTRAP_MODERATOR_EMAIL:}
