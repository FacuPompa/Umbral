<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Umbral es una comunidad para conversar sobre juegos sin adelantarte la historia." />
    <title>Umbral — Hablá de juegos sin spoilers</title>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('umbral-theme'); } catch { /* Almacenamiento no disponible. */ }
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
